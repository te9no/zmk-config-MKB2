# Relay MKB peripheral diagnostics and watchdog state to the split central.
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=y
CONFIG_ZMK_WATCHDOG_FREEZE_TIMEOUT_MS=30000
CONFIG_ZMK_WATCHDOG_FREEZE_FEED_DIVISOR=10
CONFIG_ZMK_WATCHDOG_FREEZE_STARTUP_DELAY_MS=60000
CONFIG_ZMK_WATCHDOG_FREEZE_MONITOR_LOWPRIO_QUEUE=n
CONFIG_ZMK_WATCHDOG_FATAL_DETECT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
