# Basic hardware configurations
CONFIG_SPI=y

# PMW3610 optical sensor settings
CONFIG_PMW3610=y
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=14
CONFIG_PMW3610_LOG_LEVEL_INF=y
CONFIG_SPI_THREE_WIRE_GPIO_LOG_LEVEL_INF=y

# Input processor configuration

CONFIG_ZMK_INPUT_PROCESSOR_KEYBIND=y
