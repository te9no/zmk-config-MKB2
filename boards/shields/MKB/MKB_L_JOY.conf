# Analog input settings for sensors
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ANALOG_INPUT=y
CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y
# The overlay samples at 100 Hz (10 ms). Keep the report gate below that
# period so each sample can be reported instead of batching 2-3 samples.
CONFIG_ANALOG_INPUT_REPORT_INTERVAL_MIN=8
CONFIG_ANALOG_INPUT_LOG_DBG_RAW=n
CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=n

# DYA analog input is configured locally; Studio RPC runs on this central side.
CONFIG_DYA_ANALOG_INPUT=y
CONFIG_DYA_ANALOG_INPUT_STUDIO_RPC=y
