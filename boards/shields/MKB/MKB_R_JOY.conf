# Analog input settings for sensors
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_ANALOG_INPUT=y
CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y
# Report every 100 Hz sample. The legacy driver's interval cleanup drops
# samples when this value is shorter than the 10 ms sampling period.
CONFIG_ANALOG_INPUT_REPORT_INTERVAL_MIN=0
CONFIG_ANALOG_INPUT_LOG_DBG_RAW=n
CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=n

# DYA analog input runs on the split peripheral without a USB RPC transport.
CONFIG_DYA_ANALOG_INPUT=y
