<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeroShift · MeKaBu モジュール設定</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main>
    <header>
      <h1>ZeroShift</h1>
      <p>MeKaBu モジュール設定</p>
    </header>
    <section aria-label="接続方法">
      <div class="bar">
        <strong id="side">未接続</strong>
        <button type="button" id="connection">USB 接続</button>
        <button type="button" id="bluetooth">Bluetooth 接続</button>
      </div>
      <p id="status" role="status">無線では左側を PC とペアリングし、「Bluetooth 接続」で MeKaBu を選んでください。</p>
    </section>
    <section id="target-bar" hidden><label for="target">設定する側</label> <select id="target"><option value="left">左側</option><option value="right">右側</option></select> <button id="reload">再読込</button></section>
    <form hidden id="modules">
      <div class="slots">
        <div class="slot">
          <label for="module">拡張モジュール</label>
          <select id="module" aria-describedby="module-state">
            <option value="off">未装着</option>
            <option value="pmw3610">トラックボール（PMW3610）</option>
            <option value="stick">アナログスティック（JOY）</option>
            <option value="encoder">エンコーダ</option>
            <option value="key">1uキー</option>
            <option value="rzt">磁気スティック（RZT）</option>
            <option value="tpd">トラックパッド（TPD）</option>
            <option value="lpps">LPPS（ADS1220）</option>
          </select>
          <small id="module-state"></small>
        </div>
      </div>
      <div class="actions">
        <button type="submit" id="save">設定を保存</button>
      </div>
    </form>
  </main>
</body>
</html>
